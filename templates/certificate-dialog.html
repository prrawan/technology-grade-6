  </div>
  <footer class="certificate-tools"><button type="button" class="button certificate-print"><svg class="certificate-print-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 8V3h12v5M6 17H3V9h18v8h-3M6 14h12v7H6z"/><path d="M17 11h1"/></svg> طباعة أو حفظ PDF</button><button type="button" class="button secondary certificate-celebrate"><span aria-hidden="true">✦</span> أعد الاحتفال</button><p>من نافذة الطباعة، اختر «حفظ بصيغة PDF» إذا كان متاحًا على جهازك.</p></footer>
